[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/control-plane",
    "crates/host-agent",
    "crates/gpu-bench",
    "crates/vgpu",
]

# control-plane and vgpu are added as the build order (CLAUDE.md) reaches them.

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
