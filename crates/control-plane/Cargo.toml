[package]
name = "control-plane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dependencies]
# core with the `sqlx` feature so Sats/RentalStatus derive sqlx::Type here.
vgpu-core = { path = "../core", features = ["sqlx"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
axum = "0.7"
# Runtime-checked queries (not the compile-time `query!` macro) so builds need
# no live DATABASE_URL; `migrate!` still embeds the SQL at compile time.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
# Drive the router with oneshot in the acceptance test — no real port, no flakiness.
tower = { version = "0.5", features = ["util"] }
