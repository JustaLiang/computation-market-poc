[package]
name = "vgpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vgpu"
path = "src/main.rs"

[dependencies]
# Shared DTOs only — vgpu-core stays dependency-light (no sqlx), so the CLI is
# small. This is the whole reason the API types live in core (CLAUDE.md).
vgpu-core = { path = "../core" }

# Blocking HTTP: a CLI has no need for an async runtime.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "rustls-tls",
] }
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
