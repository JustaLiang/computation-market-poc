[package]
name = "host-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vgpu-agent"
path = "src/main.rs"

[dependencies]
vgpu-core = { path = "../core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
bollard = "0.17"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.32"

# NVML exists only on NVIDIA-capable hosts (Linux/Windows). GPU hosting is Linux,
# so we compile the crate only there and provide a graceful fallback elsewhere —
# this keeps the agent buildable on a dev machine (e.g. macOS) with no CUDA stack.
[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.10"
