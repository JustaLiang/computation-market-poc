[package]
name = "gpu-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vendor-agnostic GPU compute benchmark (fp GEMM throughput + memory bandwidth)."

# An isolated benchmarking tool: it knows nothing about the marketplace. The
# host-agent can later consume its library API to derive `dlperf` on an NVIDIA
# host, but nothing here depends on rentals, Lightning, or the control plane.

[features]
default = []
# cuBLAS backend for peak NVIDIA numbers, via cudarc (runtime-loaded, so it
# builds without the CUDA toolkit present but runs only on an NVIDIA host).
# The native `metal` backend needs no feature — it's a macOS-only target dep.
cuda = ["dep:cudarc"]

[lib]
name = "gpu_bench"
path = "src/lib.rs"

[[bin]]
name = "gpu-bench"
path = "src/main.rs"

[dependencies]
# Portable GPU compute: Metal on macOS, Vulkan on NVIDIA/AMD, DX12 on Windows.
# One WGSL kernel, every vendor. Native peak-throughput backends (Apple `metal`
# ships; cuBLAS behind a feature; rocBLAS later).
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] } # host-side fp16 for fp16 GEMM

clap = { version = "4", features = ["derive"] }
comfy-table = "7"
indicatif = "0.17" # spinner while the (multi-second) suite runs
# cuBLAS backend (feature = "cuda"). Runtime-loaded (dynamic-loading) so the crate
# builds without the CUDA toolkit; it runs only on a real NVIDIA host.
# Builds only where the CUDA toolkit is present (its build script needs cuda.h);
# the `cuda` feature is therefore for NVIDIA hosts. `dynamic-linking` loads the
# CUDA libs at runtime. Not compile-checked on non-CUDA machines.
cudarc = { version = "0.12", optional = true, default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "f16",
    "dynamic-linking",
    "cuda-12060",
] }
ureq = "2" # lightweight blocking HTTP for the (opt-in) network probe
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Native Apple-GPU backend: a Metal `simdgroup_matrix` GEMM kernel (peak, no
# Python/cmake). macOS-only — Metal doesn't exist elsewhere. `objc2-metal` is the
# actively-maintained binding (the older `metal`/metal-rs crate is deprecated).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
objc2-foundation = "0.3"
